<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>宝宝你在想我吗？</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Serif+SC:wght@400;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a0a2e 0%, #2d1b4e 25%, #1a0a2e 50%, #3d2066 75%, #1a0a2e 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            font-family: 'ZCOOL KuaiLe', 'Noto Serif SC', serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }

        .star {
            position: absolute;
            width: 3px;
            height: 3px;
            background: #fff;
            border-radius: 50%;
            animation: twinkle 2s ease-in-out infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        .container {
            text-align: center;
            z-index: 10;
            padding: 20px;
            position: relative;
            z-index: 10;
        }

        .question {
            font-size: clamp(28px, 6vw, 48px);
            color: #fff;
            text-shadow: 0 0 20px rgba(255, 182, 193, 0.8),
                         0 0 40px rgba(255, 182, 193, 0.5),
                         0 0 60px rgba(255, 182, 193, 0.3);
            margin-bottom: 60px;
            animation: float 3s ease-in-out infinite;
            letter-spacing: 4px;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .buttons-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            min-height: 120px;
            position: relative;
        }

        .btn {
            padding: 20px 50px;
            font-size: 24px;
            font-family: 'ZCOOL KuaiLe', 'Noto Serif SC', serif;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.5s;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn-love {
            background: linear-gradient(135deg, #ff6b9d 0%, #ff8a9b 50%, #ffa5b5 100%);
            color: #fff;
            box-shadow: 0 10px 30px rgba(255, 107, 157, 0.5),
                        0 0 20px rgba(255, 107, 157, 0.3),
                        inset 0 2px 10px rgba(255, 255, 255, 0.3);
        }

        .btn-love:hover {
            transform: scale(1.1);
            box-shadow: 0 15px 40px rgba(255, 107, 157, 0.7),
                        0 0 30px rgba(255, 107, 157, 0.5);
        }

        .btn-no {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.5),
                        0 0 20px rgba(102, 126, 234, 0.3);
        }

        .btn-no:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.7);
        }

        .btn:active {
            transform: scale(0.95);
        }

        .sakura-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
            overflow: hidden;
        }

        .sakura {
            position: absolute;
            font-size: 30px;
            color: #ffb7c5;
            text-shadow: 0 0 10px rgba(255, 183, 197, 0.8),
                         0 0 20px rgba(255, 183, 197, 0.5);
            animation: fall linear forwards;
            opacity: 0;
        }

        @keyframes fall {
            0% {
                opacity: 0;
                transform: translateY(-100px) rotate(0deg) scale(0.5);
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                opacity: 0;
                transform: translateY(100vh) rotate(720deg) scale(1);
            }
        }

        .message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: clamp(36px, 8vw, 72px);
            color: #ff6b9d;
            text-shadow: 0 0 30px rgba(255, 107, 157, 0.8),
                         0 0 60px rgba(255, 107, 157, 0.5),
                         0 0 90px rgba(255, 107, 157, 0.3);
            z-index: 200;
            animation: heartBeat 1s ease-in-out infinite;
            white-space: nowrap;
        }

        @keyframes heartBeat {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.1); }
        }

        .hidden {
            display: none !important;
        }

        .hearts-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .heart-bg {
            position: absolute;
            color: rgba(255, 182, 193, 0.2);
            font-size: 20px;
            animation: floatUp 8s linear infinite;
        }

        @keyframes floatUp {
            0% {
                opacity: 0;
                transform: translateY(100vh) scale(0.5);
            }
            20% {
                opacity: 0.3;
            }
            80% {
                opacity: 0.3;
            }
            100% {
                opacity: 0;
                transform: translateY(-20vh) scale(1);
            }
        }

        .btn-ghost {
            opacity: 0;
            pointer-events: none;
            transition: all 0.5s ease;
        }

        @media (max-width: 480px) {
            .question {
                letter-spacing: 2px;
            }
            .btn {
                padding: 15px 35px;
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="stars" id="stars"></div>
    <div class="hearts-bg" id="heartsBg"></div>

    <div class="container">
        <h1 class="question">宝宝你在想我吗？</h1>
        <div class="buttons-container" id="buttonsContainer">
            <button class="btn btn-love" id="btnLove">很想</button>
            <button class="btn btn-no" id="btnNo">不想</button>
        </div>
    </div>

    <div class="sakura-container" id="sakuraContainer"></div>

    <script>
        const btnLove = document.getElementById('btnLove');
        const btnNo = document.getElementById('btnNo');
        const buttonsContainer = document.getElementById('buttonsContainer');
        const sakuraContainer = document.getElementById('sakuraContainer');
        const starsContainer = document.getElementById('stars');
        const heartsBg = document.getElementById('heartsBg');

        let loveScale = 1;
        let isSakuraFalling = false;

        function createStars() {
            for (let i = 0; i < 100; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 2 + 's';
                star.style.animationDuration = (Math.random() * 2 + 2) + 's';
                starsContainer.appendChild(star);
            }
        }

        function createHeartsBg() {
            for (let i = 0; i < 15; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.className = 'heart-bg';
                    heart.innerHTML = '❤';
                    heart.style.left = Math.random() * 100 + '%';
                    heart.style.animationDuration = (Math.random() * 5 + 6) + 's';
                    heart.style.fontSize = (Math.random() * 15 + 15) + 'px';
                    heartsBg.appendChild(heart);

                    setTimeout(() => {
                        heart.remove();
                    }, 8000);
                }, i * 500);
            }
            setInterval(() => {
                const heart = document.createElement('div');
                heart.className = 'heart-bg';
                heart.innerHTML = '❤';
                heart.style.left = Math.random() * 100 + '%';
                heart.style.animationDuration = (Math.random() * 5 + 6) + 's';
                heart.style.fontSize = (Math.random() * 15 + 15) + 'px';
                heartsBg.appendChild(heart);

                setTimeout(() => {
                    heart.remove();
                }, 8000);
            }, 800);
        }

        function createSakura() {
            const sakura = document.createElement('div');
            sakura.className = 'sakura';
            sakura.innerHTML = ['❀', '✿', '❃', '✾', '💮'][Math.floor(Math.random() * 5)];
            sakura.style.left = Math.random() * 100 + '%';
            sakura.style.fontSize = (Math.random() * 20 + 20) + 'px';
            sakura.style.animationDuration = (Math.random() * 3 + 6) + 's';
            sakura.style.opacity = 0;
            sakuraContainer.appendChild(sakura);

            setTimeout(() => {
                sakura.style.opacity = 1;
            }, 100);

            setTimeout(() => {
                sakura.remove();
            }, 8000);
        }

        function startSakura() {
            if (!isSakuraFalling) {
                isSakuraFalling = true;
                const message = document.createElement('div');
                message.className = 'message';
                message.id = 'loveMessage';
                message.textContent = '我也好想你！';
                document.body.appendChild(message);

                for (let i = 0; i < 3; i++) {
                    createHeartsBg();
                }
            }

            const interval = setInterval(createSakura, 150);
            setTimeout(() => clearInterval(interval), 8000);
            setInterval(() => {
                if (isSakuraFalling) {
                    createSakura();
                }
            }, 200);
        }

        btnNo.addEventListener('click', function() {
            loveScale += 0.15;
            btnLove.style.transform = `scale(${loveScale})`;
            
            const btnNoRect = btnNo.getBoundingClientRect();
            const btnLoveRect = btnLove.getBoundingClientRect();
            
            if (loveScale > 2.5) {
                btnNo.classList.add('btn-ghost');
                setTimeout(() => {
                    btnNo.style.display = 'none';
                }, 500);
            }
        });

        btnLove.addEventListener('click', function() {
            buttonsContainer.classList.add('hidden');
            startSakura();
        });

        createStars();
        createHeartsBg();
        setInterval(createHeartsBg, 800);
    </script>
</body>
</html>
